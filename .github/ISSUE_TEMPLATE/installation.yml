name: Problema de instalación
description: Reporta problemas instalando MCP o data pack.
title: "Instalación: <resumen>"
labels: [installation]
body:
  - type: input
    id: os
    attributes:
      label: Sistema operativo
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Comandos ejecutados
      render: powershell
  - type: textarea
    id: output
    attributes:
      label: Salida/error
      render: text
