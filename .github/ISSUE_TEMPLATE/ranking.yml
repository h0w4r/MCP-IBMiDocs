name: Query mala o ranking mejorable
description: Reporta una consulta IBM i que no recupera el tópico esperado.
title: "Ranking: <consulta>"
labels: [ranking, corpus]
body:
  - type: input
    id: query
    attributes:
      label: Consulta
      description: Texto exacto usado en ibmi_docs_search o ibmi_docs_report_query
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: Resultado esperado
      description: Título o URL del tópico esperado
  - type: textarea
    id: actual
    attributes:
      label: Resultado actual
      description: "Pega el Markdown generado por: ibmi-docs report-query \"tu consulta\" --expected-title \"título esperado\" --out ranking.md"
