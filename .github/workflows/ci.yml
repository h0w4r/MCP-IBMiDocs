name: CI

on:
  push:
    branches: [main, "CK/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test-smoke:
    name: ${{ matrix.os }} / node-${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: [22]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Unit and golden tests
        run: npm test

      - name: Smoke corpus
        run: npm run smoke

      - name: Golden benchmark
        run: npm run bench:golden

      - name: Quality corpus gate
        run: npm run quality:check

      - name: Validate data pack
        run: npm run pack:validate

      - name: Verify anti runtime dependency on RDi endpoint
        shell: pwsh
        run: |
          $matches = Select-String -Path src/**/*.ts,README.md,NOTICE.md -Pattern '127\.0\.0\.1:52070|localhost:52070' -ErrorAction SilentlyContinue
          if ($matches) {
            $matches | Format-Table -AutoSize
            throw 'Runtime/docs públicos no deben depender del endpoint temporal RDi.'
          }

      - name: Verify npm package runtime payload
        shell: pwsh
        run: |
          $json = npm pack --dry-run --json | ConvertFrom-Json
          $packed = $json[0].files.path
          $required = @(
            'dist/src/server.js',
            'dist/src/cli.js',
            'postinstall.cjs',
            'data/pack/manifest.json',
            'data/pack/ibmi-docs.sqlite.parts.json',
            'models/ibmi-e5-base-finetuned-v1/model-manifest.json',
            'models/ibmi-reranker-finetuned-v1/model-manifest.json'
          )
          foreach ($file in $required) {
            if ($packed -notcontains $file) {
              throw "Falta archivo runtime requerido en npm pack: $file"
            }
          }
          $sqliteParts = (Get-Content data/pack/ibmi-docs.sqlite.parts.json -Raw | ConvertFrom-Json).parts.name
          foreach ($part in $sqliteParts) {
            $packedPath = "data/pack/$part"
            if ($packed -notcontains $packedPath) {
              throw "Falta fragmento SQLite requerido en npm pack: $packedPath"
            }
          }
          $modelDirectories = @(
            'models/ibmi-e5-base-finetuned-v1',
            'models/ibmi-reranker-finetuned-v1'
          )
          foreach ($modelDirectory in $modelDirectories) {
            $manifest = Get-Content "$modelDirectory/model-manifest.json" -Raw | ConvertFrom-Json
            foreach ($part in $manifest.onnxParts.name) {
              $packedPath = "$modelDirectory/onnx/$part"
              if ($packed -notcontains $packedPath) {
                throw "Falta fragmento ONNX requerido en npm pack: $packedPath"
              }
            }
          }
          $forbiddenPrefixes = @(
            'data/eval/',
            '.tmp/',
            'data/rdi-export/',
            'data/ibm-docs-cache/'
          )
          foreach ($prefix in $forbiddenPrefixes) {
            $matches = $packed | Where-Object { $_.StartsWith($prefix) }
            if ($matches) {
              $matches | Select-Object -First 20 | Format-Table -AutoSize
              throw "El paquete npm incluye artefactos internos no publicables: $prefix"
            }
          }
          if ($packed -contains 'dist/ibmi-docs-pack.tgz') {
            throw 'El paquete npm no debe incluir archivos .tgz generados; solo el data pack desempaquetado runtime.'
          }
          $fullOnnx = $packed | Where-Object { $_ -match '^models/.+/onnx/model_quantized\.onnx$' }
          if ($fullOnnx) {
            throw 'Los ONNX completos superan el límite de GitHub y deben reconstruirse desde fragmentos en postinstall.'
          }
          if ($packed -contains 'data/pack/ibmi-docs.sqlite') {
            throw 'El SQLite completo debe reconstruirse desde fragmentos en postinstall y no duplicarse en npm.'
          }

      - name: Create data pack archive artifact
        if: matrix.os == 'windows-latest'
        run: npm run pack:archive -- data/pack dist/ibmi-docs-pack.tgz

      - name: Upload data pack artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: ibmi-docs-pack
          path: dist/ibmi-docs-pack.tgz

