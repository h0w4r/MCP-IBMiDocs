name: CI

on:
  push:
    branches: [main, "CK/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test-smoke:
    name: ${{ matrix.os }} / node-${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: [22]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Unit and golden tests
        run: npm test

      - name: Smoke corpus
        run: npm run smoke

      - name: Golden benchmark
        run: npm run bench:golden

      - name: Quality corpus gate
        run: npm run quality:check

      - name: Validate data pack
        run: npm run pack:validate

      - name: Verify anti runtime dependency on RDi endpoint
        shell: pwsh
        run: |
          $matches = Select-String -Path src/**/*.ts,README.md,NOTICE.md -Pattern '127\.0\.0\.1:52070|localhost:52070' -ErrorAction SilentlyContinue
          if ($matches) {
            $matches | Format-Table -AutoSize
            throw 'Runtime/docs públicos no deben depender del endpoint temporal RDi.'
          }

      - name: Verify npm package runtime payload
        shell: pwsh
        run: |
          $json = npm pack --dry-run --json | ConvertFrom-Json
          $packed = $json[0].files.path
          $required = @(
            'dist/src/server.js',
            'dist/src/cli.js',
            'postinstall.cjs',
            'runtime-assets.json'
          )
          foreach ($file in $required) {
            if ($packed -notcontains $file) {
              throw "Falta archivo runtime requerido en npm pack: $file"
            }
          }
          $forbiddenPrefixes = @(
            'data/pack/',
            'models/',
            'data/eval/',
            '.tmp/',
            'data/rdi-export/',
            'data/ibm-docs-cache/'
          )
          foreach ($prefix in $forbiddenPrefixes) {
            $matches = $packed | Where-Object { $_.StartsWith($prefix) }
            if ($matches) {
              $matches | Select-Object -First 20 | Format-Table -AutoSize
              throw "El paquete npm incluye artefactos internos no publicables: $prefix"
            }
          }
          if ($json[0].size -gt 50MB) {
            throw "El paquete npm volvió a incluir activos pesados: $($json[0].size) bytes"
          }

      - name: Create release assets
        if: matrix.os == 'windows-latest'
        run: npm run release:assets

      - name: Test packed installation with release assets
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/test-packed-install.ps1

      - name: Upload release assets
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: ibmi-docs-runtime-assets
          path: |
            .tmp/release-assets/*.tgz
            runtime-assets.json

