name: Release data pack

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de release existente donde subir ibmi-docs-pack.tgz"
        required: true

permissions:
  contents: write

jobs:
  data-pack-release-asset:
    name: Build and upload ibmi-docs-pack.tgz
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Validate data pack
        run: npm run pack:validate

      - name: Create data pack archive
        run: npm run pack:archive -- data/pack dist/ibmi-docs-pack.tgz

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ibmi-docs-pack
          path: dist/ibmi-docs-pack.tgz

      - name: Resolve target release tag
        id: release
        shell: pwsh
        run: |
          $tag = '${{ github.event.release.tag_name }}'
          if (-not $tag) { $tag = '${{ inputs.tag }}' }
          if (-not $tag) { throw 'No se pudo resolver tag de release.' }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.release.outputs.tag }}" dist/ibmi-docs-pack.tgz --clobber
