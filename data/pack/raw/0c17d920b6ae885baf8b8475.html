<h1 class="topictitle1" id="usecpy__title__1">Results of the /COPY or /INCLUDE during Compile</h1><div id="lastModifiedDate"><span>Last Updated</span>: 2025-04-08</div>


<div class="body">
<p>During compilation, the specified file members are merged into the program
at the point where the <a href="/docs/en/ssw_ibm_i_76/rzasd/cdcopy.htm#cdcopy">/COPY</a> or <a href="/docs/en/ssw_ibm_i_76/rzasd/cdcopy.htm#cdcopy">/INCLUDE</a> statement occurs. All  members will appear in the COPY member
table.</p>

</div>
