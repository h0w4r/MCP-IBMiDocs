<h1 class="topictitle1" id="stable__title__1">Table Names</h1><div id="lastModifiedDate"><span>Last Updated</span>: 2025-12-15</div>


<div class="body">
<div class="p">The following additional rules apply to table names: 
<ul class="cds--list--unordered">
<li class="cds--list__item">A table name can contain from 3 to 10 characters.</li>

<li class="cds--list__item">A table name must begin with the letters TAB.</li>

<li class="cds--list__item">A table cannot be defined in a subprocedure.</li>

</ul>
</div>
