<h1 class="topictitle1" id="rzaq9osdbDspJrn__title__1">CRTJRN and CRTJRNRCV command changes</h1><div id="lastModifiedDate"><span>Last Updated</span>: 2025-11-20</div>





<div class="body conbody"><p class="shortdesc"></p>

<p>The default value of the Authority (<span class="keyword parmname">AUT</span>) parameter of the Create Journal
(<span class="keyword cmdname">CRTJRN</span>) and Create Journal Receiver (<span class="keyword cmdname">CRTJRNRCV</span>) commands has
changed from *LIBCRTAUT to *EXCLUDE.</p>

</div>
