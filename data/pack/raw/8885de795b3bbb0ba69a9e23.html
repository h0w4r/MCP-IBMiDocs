<h1 class="topictitle1" id="cddefc__title__1">Defining Conditions</h1><div id="lastModifiedDate"><span>Last Updated</span>: 2025-10-07</div>


<div class="body">
<p>Condition-names can be added to or removed from a list of currently defined
conditions using the defining condition directives /DEFINE and /UNDEFINE.</p>
