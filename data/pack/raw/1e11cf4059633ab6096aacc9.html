<h1 class="topictitle1" id="sexcpt__title__1">EXCEPT Names</h1><div id="lastModifiedDate"><span>Last Updated</span>: 2025-10-07</div>


<div class="body">
<div class="p">An EXCEPT name is a symbolic name assigned to an exception output record.  The following additional rule applies to EXCEPT names: 
<ul class="cds--list--unordered">
<li class="cds--list__item">The same EXCEPT name can be assigned to more than one output record.</li>

</ul>
</div>

</div>
